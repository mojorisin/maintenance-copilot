[project]
name = "maintenance-copilot"
version = "1.0.0"
description = "Agentic assistant over maintenance work orders, sensor data and equipment manuals — reference architecture for industrial and energy operations"
readme = "README.md"
license = "MIT"
authors = [{ name = "mojorisin" }]
requires-python = ">=3.12"
dependencies = [
    "langchain-anthropic==1.7.6",
    "langchain-core==1.7.0",
    "langgraph==1.2.17",
    "mcp==2.3.0",
    "numpy==2.5.4",
    "pandas==3.1.0",
    "python-dotenv==1.2.4",
    "streamlit==1.66.1",
]

[project.scripts]
mc = "maintenance_copilot.cli:main"

[project.optional-dependencies]
openai = [
    "langchain-openai==1.7.2",
]
google = [
    "langchain-google-genai==4.4.2",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# pycodestyle, pyflakes, import sorting, bugbear, pyupgrade, simplify
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

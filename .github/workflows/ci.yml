name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan the full history, not just the latest commit
      # Runs the gitleaks CLI directly rather than gitleaks-action, which
      # fails on a repo's first push (it scans from the root commit's parent).
      - name: Install gitleaks (checksum-verified)
        env:
          VERSION: 8.24.3
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}
          curl -sSLO "${base}/gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSLO "${base}/gitleaks_${VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${VERSION}_checksums.txt"
          tar -xzf "gitleaks_${VERSION}_linux_x64.tar.gz" gitleaks
      - name: Scan full git history for secrets
        run: ./gitleaks git --redact --verbose .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Test (offline, no API keys needed)
        run: uv run pytest
